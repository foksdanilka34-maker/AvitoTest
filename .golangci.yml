run:
  timeout: 5m

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  disable-all: true
  enable:
    - errcheck    
    - gosimple     
    - govet         
    - ineffassign   
    - staticcheck   
    - unused      
    
    - gofmt       
    
    - misspell    
    - bodyclose  
    - gosec    

linters-settings:
  errcheck:
    check-type-assertions: true
  
  govet:
    enable-all: true
    disable:
      - fieldalignment 

  gosec:
    excludes:
      - G104 

issues:
  exclude-dirs:
    - vendor
    - environment
  
  max-same-issues: 3

  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
