services:
  avito_db:
    image: postgres:17-alpine
    container_name: avito_service_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: avito_db
    ports:
      - "5432:5432"
    volumes:
      - ./environment/avito_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d avito_db"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - app_network
  
  migrate_avito:
    image: migrate/migrate
    entrypoint: ["migrate"]
    depends_on:
      avito_db: { condition: service_healthy }
    volumes:
      - ./migrations:/migrations
    command: >
      -path /migrations
      -database "postgres://postgres:postgres@avito_db:5432/avito_db?sslmode=disable"
      up
    networks: [app_network]

networks:
  app_network: